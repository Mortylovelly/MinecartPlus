name: Build Mod

on:
  push:
    branches: [ main, minecraft-1.20.1-fabric ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Apply 1.20.1 compatibility pass
        if: github.event_name == 'push' && github.ref_name == 'minecraft-1.20.1-fabric'
        run: |
          python3 scripts/port_1201_compat.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, transform):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              new = transform(text)
              if new != text:
                  file.write_text(new, encoding='utf-8')
                  print(f'finalized {path}')

          edit(
              'src/main/java/com/minecartmagic/entity/SelfPropellingBoatEntity.java',
              lambda t: t
              .replace(
                  'boatStack.addEnchantment(\n                    tailwind,\n                    tailwindLevel\n            );',
                  'boatStack.addEnchantment(\n                    tailwind.value(),\n                    tailwindLevel\n            );'
              )
              .replace(
                  'fuelInventory.toNbtList(\n                        getWorld().getRegistryManager()\n                )',
                  'fuelInventory.toNbtList()'
              )
          )

          edit(
              'src/main/java/com/minecartmagic/mixin/FurnaceMinecartGuiMixin.java',
              lambda t: re.sub(
                  r'minecartmagic\$fuelInventory\.toNbtList\(\s*minecart\.getWorld\(\)\.getRegistryManager\(\)\s*\)',
                  'minecartmagic$fuelInventory.toNbtList()',
                  t,
              ).replace(
                  'minecartmagic$fuelInventory.readNbtList(\n                    nbt.getList(\n                            "MinecartMagicFuelInventory",\n                            NbtElement.COMPOUND_TYPE\n                    ),\n                    minecart.getWorld().getRegistryManager()\n            );',
                  'minecartmagic$fuelInventory.readNbtList(\n                    nbt.getList(\n                            "MinecartMagicFuelInventory",\n                            NbtElement.COMPOUND_TYPE\n                    )\n            );'
              )
          )

          edit(
              'src/main/java/com/minecartmagic/entity/SelfPropellingBoatEntity.java',
              lambda t: t.replace(
                  'fuelInventory.readNbtList(\n                    nbt.getList(\n                            "FuelInventory",\n                            NbtElement.COMPOUND_TYPE\n                    ),\n                    getWorld().getRegistryManager()\n            );',
                  'fuelInventory.readNbtList(\n                    nbt.getList(\n                            "FuelInventory",\n                            NbtElement.COMPOUND_TYPE\n                    )\n            );'
              )
          )

          edit(
              'src/main/java/com/minecartmagic/network/ModNetworking.java',
              lambda t: t.replace(
                  'BoatScreenPayload.TYPE,',
                  'BoatScreenPayload.ID,'
              )
          )

          if git diff --quiet; then
            echo '1.20.1 compatibility pass made no changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts .github/workflows/build.yml
          git commit -m 'Apply Minecraft 1.20.1 API compatibility [skip ci]'
          git push origin HEAD:minecraft-1.20.1-fabric

      - name: Resolve dependencies and inspect GeckoLib
        if: github.event_name != 'push' || github.ref_name != 'minecraft-1.20.1-fabric'
        shell: bash
        run: |
          set -e
          ./gradlew dependencies --no-daemon >/tmp/gradle-dependencies.txt
          find "$HOME/.gradle/caches" -type f -iname '*geckolib*1.20.1*4.8.4*.jar' -print
          while IFS= read -r jarfile; do
            echo "=== GeckoLib JAR: $jarfile ==="
            jar tf "$jarfile" | grep -E 'software/bernie/geckolib/(animatable|animation|core|util)' | head -120 || true
          done < <(find "$HOME/.gradle/caches" -type f -iname '*geckolib*1.20.1*4.8.4*.jar')

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecartmagic-1.20.1
          path: build/libs/*.jar
